<div class="space-y-3">
  <div
    class="group relative bg-muted border border-border border-dashed rounded-lg w-full h-40 overflow-hidden"
  >
    @if (imageUrl) {
      <img [src]="imageUrl" alt="Category image preview" class="w-full h-full object-cover" />
      <div
        class="absolute inset-0 flex justify-center items-center gap-2 bg-black/50 transition-opacity"
        [class.opacity-0]="!busy"
        [class.group-hover:opacity-100]="!busy"
      >
        @if (busy) {
          <hlm-spinner class="size-5 text-white" />
        } @else {
          <label hlmBtn variant="secondary" size="sm" class="gap-1.5 cursor-pointer">
            <input type="file" accept="image/*" hidden (change)="onFile($event)" />
            <ng-icon name="lucideUpload" size="0.9rem" />
            Replace
          </label>
          <button hlmBtn variant="destructive" size="sm" class="gap-1.5" (click)="remove.emit()">
            <ng-icon name="lucideTrash2" size="0.9rem" />
            Remove
          </button>
        }
      </div>
    } @else if (busy) {
      <div class="flex justify-center items-center w-full h-full text-muted-foreground">
        <hlm-spinner class="size-5" />
      </div>
    } @else {
      <label
        class="flex flex-col justify-center items-center gap-2 w-full h-full text-muted-foreground hover:text-foreground transition-colors cursor-pointer"
      >
        <input type="file" accept="image/*" hidden (change)="onFile($event)" />
        <ng-icon name="lucideImage" size="1.5rem" />
        <span class="text-sm">Click to upload an image</span>
        <span class="text-xs">PNG, JPG up to 5MB</span>
      </label>
    }
  </div>
</div>
