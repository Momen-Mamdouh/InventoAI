<nav
  class="top-4 md:top-6 left-1/2 z-50 fixed bg-background/60 shadow-2xl backdrop-blur-xl border border-border/40 rounded-full w-[95%] max-w-6xl transition-all -translate-x-1/2 duration-300"
>
  <div class="flex justify-between items-center px-4 sm:px-6 lg:px-8 w-full h-16">
    <a
      routerLink="/"
      hlmBtn
      variant="ghost"
      class="group flex items-center gap-2 p-2 h-auto"
      aria-label="INVENTO Home Page"
    >
      <img src="light-logo.png" class="dark:hidden block w-auto h-13" alt="INVENTO Logo" />
      <img src="logo.png" class="hidden dark:block w-auto h-13" alt="INVENTO Logo" />
    </a>

    <div class="flex items-center gap-4">
      <app-lang-switcher />
      <app-theme-switcher />

      @if (isAuthenticated()) {
        <a [href]="dashboardUrl" hlmBtn variant="outline" class="gap-2">
          <ng-icon name="lucideLayoutDashboard" class="text-sm"></ng-icon>
          {{ 'nav_dashboard' | translate }}
        </a>
        <button hlmBtn variant="ghost" class="gap-2" (click)="signOut()">
          <ng-icon name="lucideLogOut" class="text-sm"></ng-icon>
          {{ 'nav_sign_out' | translate }}
        </button>
      } @else {
        <a routerLink="/auth/login" hlmBtn variant="ghost">{{ 'nav_login' | translate }}</a>
        <a routerLink="/auth/register" hlmBtn>{{ 'nav_sign_up' | translate }}</a>
      }
    </div>
  </div>
</nav>
