<div class="min-h-screen flex w-full bg-background">
  <!-- Left Side: Form Content -->
  <div
    class="w-full md:w-[45%] lg:w-[40%] flex flex-col p-4 md:p-6 lg:px-12 relative bg-background border-r border-border overflow-y-auto no-scrollbar"
  >
    <!-- Little Center Switcher Navbar -->
    <header class="w-full flex justify-center pt-2 pb-1">
      <nav
        class="inline-flex items-center gap-2 p-1.5 px-3 rounded-full bg-card/80 hover:bg-card backdrop-blur-md border border-border/60 shadow-2xs transition-all select-none"
        aria-label="Preferences"
      >
        <app-lang-switcher />
        <div class="h-4 w-px bg-border/60 mx-0.5" aria-hidden="true"></div>
        <app-theme-switcher />
      </nav>
    </header>

    <!-- Logo at the top -->
    <div class="flex items-center justify-center mb-6 mt-3">
      <img src="/light-logo.png" alt="Invento OS" class="h-16 object-contain dark:hidden" />
      <img src="/logo.png" alt="Invento OS" class="h-16 object-contain hidden dark:block" />
    </div>

    <!-- Form Area -->
    <div class="w-full max-w-[400px] mx-auto flex-1 flex flex-col justify-center">
      <router-outlet></router-outlet>
    </div>

    <div class="mt-8 text-center text-xs text-muted-foreground">
      {{ 'auth_terms_privacy' | translate }}
    </div>
  </div>

  <!-- Right Side: Drifting Wall (Hidden on Mobile) -->
  <div class="hidden md:flex w-[55%] lg:w-[60%] relative bg-[#0b0b12] overflow-hidden">
    <app-drift-wall class="w-full h-full"></app-drift-wall>
  </div>
</div>
