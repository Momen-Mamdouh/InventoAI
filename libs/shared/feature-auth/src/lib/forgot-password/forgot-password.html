<div class="flex flex-col h-full text-start">
  <div class="mb-8">
    <h1 hlmH1 class="text-foreground mb-2">
      {{ 'auth_forgot_page_title' | translate }}
    </h1>
    <p hlmMuted class="text-muted-foreground">
      {{ 'auth_forgot_desc' | translate }}
    </p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5 text-start">
      <label hlmLabel for="email" class="text-xs sm:text-sm font-medium text-foreground block">
        {{ 'auth_email_label' | translate }}
      </label>
      <div class="relative flex items-center group">
        <ng-icon
          name="lucideMail"
          size="18"
          class="absolute start-3.5 text-muted-foreground/60 transition-colors pointer-events-none group-focus-within:text-primary"
        />
        <input
          hlmInput
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="'auth_email_placeholder' | translate"
          class="h-11 sm:h-12 w-full rounded-xl ps-10 pe-4 bg-background/50 border-input text-sm sm:text-base placeholder:text-muted-foreground/50 transition-all focus-visible:ring-2 focus-visible:ring-ring focus-visible:border-ring"
        />
      </div>
      @if (forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid) {
        <div class="ps-1 pt-0.5 text-xs text-destructive text-start">{{ 'auth_email_error' | translate }}</div>
      }
    </div>

    <button
      hlmBtn
      class="w-full mt-8 h-11 sm:h-12 rounded-xl text-sm sm:text-base font-semibold"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>{{ 'auth_usersite_forgot_btn' | translate }}</span>
      } @else {
        <span>{{ 'auth_forgot_sending' | translate }}</span>
      }
    </button>
  </form>

  <p hlmMuted class="text-center text-muted-foreground text-sm mt-8">
    {{ 'auth_remember_pwd' | translate }}
    <a [routerLink]="[authBasePath, 'login']" class="font-medium text-primary hover:underline">{{
      'auth_log_in_link' | translate
    }}</a>
  </p>
</div>
