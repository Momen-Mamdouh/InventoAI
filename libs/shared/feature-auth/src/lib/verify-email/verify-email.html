<div class="flex flex-col h-full text-left">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">
      {{ 'auth_verify_title' | translate }}
    </h1>
    <p class="text-sm text-slate-500 dark:text-zinc-400">
      {{ 'auth_we_sent_code' | translate }} <strong>{{ userEmail }}</strong
      >.
    </p>
  </div>

  <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5">
      <label hlmLabel for="otp1" class="text-sm font-semibold text-slate-700 dark:text-white">{{
        'auth_verify_code_label' | translate
      }}</label>
      <div class="flex justify-between gap-2 my-4">
        <input
          id="otp1"
          (input)="onOtpInput(0, $event, 'otp2')"
          (keydown)="onOtpKeyDown($event)"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
        <input
          id="otp2"
          (input)="onOtpInput(1, $event, 'otp3')"
          (keydown)="onOtpKeyDown($event, 'otp1')"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
        <input
          id="otp3"
          (input)="onOtpInput(2, $event, 'otp4')"
          (keydown)="onOtpKeyDown($event, 'otp2')"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
        <input
          id="otp4"
          (input)="onOtpInput(3, $event, 'otp5')"
          (keydown)="onOtpKeyDown($event, 'otp3')"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
        <input
          id="otp5"
          (input)="onOtpInput(4, $event, 'otp6')"
          (keydown)="onOtpKeyDown($event, 'otp4')"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
        <input
          id="otp6"
          (input)="onOtpInput(5, $event)"
          (keydown)="onOtpKeyDown($event, 'otp5')"
          type="text"
          class="w-full h-14 text-center text-2xl font-bold !rounded-xl !border-slate-200 border bg-transparent focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          maxlength="1"
        />
      </div>
      @if (verifyForm.get('otp')?.touched && verifyForm.get('otp')?.invalid) {
        <div class="text-xs text-red-500 mt-1">{{ 'auth_verify_code_req' | translate }}</div>
      }
    </div>

    <button
      hlmBtn
      class="w-full mt-8 !py-6 text-base font-semibold"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>{{ 'auth_verify_btn' | translate }}</span>
      } @else {
        <span>{{ 'auth_verify_verifying' | translate }}</span>
      }
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-8">
    {{ 'auth_didnt_receive' | translate }}
    <button
      (click)="resendCode()"
      [disabled]="isResending()"
      class="font-bold text-blue-500 hover:underline disabled:opacity-50 disabled:no-underline"
    >
      @if (!isResending()) {
        <span>{{ 'auth_verify_resend' | translate }}</span>
      } @else {
        <span>{{ 'auth_forgot_sending' | translate }}</span>
      }
    </button>
  </p>
</div>
