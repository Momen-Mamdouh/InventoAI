<div class="flex flex-col h-full text-start">
  <div class="mb-8">
    <h1 hlmH1 class="text-foreground mb-2">
      {{ 'auth_verify_title' | translate }}
    </h1>
    <p hlmMuted class="text-muted-foreground">
      {{ 'auth_we_sent_code' | translate }} <strong>{{ userEmail }}</strong
      >.
    </p>
  </div>

  <form [formGroup]="verifyForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5 text-start">
      <label hlmLabel for="otp1" class="text-xs sm:text-sm font-medium text-foreground block">{{
        'auth_verify_code_label' | translate
      }}</label>
      <brn-input-otp
        hlmInputOtp
        formControlName="otp"
        maxLength="6"
        inputId="otp1"
        class="flex justify-between gap-2 my-4"
      >
        <hlm-input-otp-slot
          [index]="0"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
        <hlm-input-otp-slot
          [index]="1"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
        <hlm-input-otp-slot
          [index]="2"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
        <hlm-input-otp-slot
          [index]="3"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
        <hlm-input-otp-slot
          [index]="4"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
        <hlm-input-otp-slot
          [index]="5"
          class="w-full h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold rounded-xl border border-input bg-background/50 text-foreground transition-all has-[brn-input-otp-slot[data-active='true']]:border-primary has-[brn-input-otp-slot[data-active='true']]:ring-2 has-[brn-input-otp-slot[data-active='true']]:ring-primary/20"
        />
      </brn-input-otp>
      @if (verifyForm.get('otp')?.touched && verifyForm.get('otp')?.invalid) {
        <div class="ps-1 pt-0.5 text-xs text-destructive text-start">{{ 'auth_verify_code_req' | translate }}</div>
      }
    </div>

    <button
      hlmBtn
      class="w-full mt-8 h-11 sm:h-12 rounded-xl text-sm sm:text-base font-semibold"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>{{ 'auth_verify_btn' | translate }}</span>
      } @else {
        <span>{{ 'auth_verify_verifying' | translate }}</span>
      }
    </button>
  </form>

  <p hlmMuted class="text-center text-muted-foreground text-sm mt-8">
    {{ 'auth_didnt_receive' | translate }}
    <button
      hlmBtn
      variant="link"
      type="button"
      (click)="resendCode()"
      [disabled]="isResending()"
      class="h-auto p-0 font-medium text-primary hover:underline disabled:opacity-50 disabled:no-underline cursor-pointer"
    >
      @if (!isResending()) {
        <span>{{ 'auth_verify_resend' | translate }}</span>
      } @else {
        <span>{{ 'auth_forgot_sending' | translate }}</span>
      }
    </button>
  </p>
</div>
