@if (showLoader()) {
  <div
    class="loader-overlay"
    [class.fade-out]="!isLoading()"
    role="status"
    aria-live="polite"
    aria-label="Loading application"
  >
    <div class="flex flex-col items-center justify-center gap-6">
      <div class="loader-svg-container">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 500 500"
          width="100%"
          height="100%"
          aria-hidden="true"
        >
          <defs>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="6"
                flood-opacity="0.12"
                flood-color="#000000"
              />
            </filter>
          </defs>

          <g filter="url(#softShadow)">
            <!-- Outer Border / Track -->
            <path
              class="loader-track text-foreground/15 dark:text-muted-foreground/30"
              d="M 160 115 L 385 115 L 385 385 L 115 385 L 115 160"
              fill="none"
              stroke="currentColor"
              stroke-width="30"
              stroke-linejoin="miter"
              stroke-linecap="butt"
            />

            <!-- Central 'N' Brandmark -->
            <path
              class="loader-mark text-foreground"
              d="M 180 320 L 180 180 L 320 320 L 320 180"
              fill="none"
              stroke="currentColor"
              stroke-width="32"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>

          <!-- Animated Primary Dot -->
          <circle
            class="blue-dot"
            cx="115"
            cy="115"
            r="38"
            fill="var(--primary, #307be8)"
          />
        </svg>
      </div>

      @if (showLabel() && label()) {
        <div
          class="loader-label font-mono text-[11px] tracking-[0.25em] text-muted-foreground/80 uppercase select-none"
        >
          {{ label() }}
        </div>
      }
    </div>
  </div>
}
