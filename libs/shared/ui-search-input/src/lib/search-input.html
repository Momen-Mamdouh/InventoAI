<div class="group/search relative flex h-full w-full items-center">
  <ng-icon
    name="lucideSearch"
    class="text-muted-foreground group-focus-within/search:text-primary pointer-events-none absolute start-3 z-10 h-4 w-4 transition-colors"
  />

  @if (control(); as ctrl) {
    <input
      hlmInput
      type="text"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [formControl]="ctrl"
      (keyup.enter)="enterPressed.emit()"
      class="w-full ps-9 pe-9 h-9.5 rounded-lg bg-background/70 dark:bg-muted/40 border border-border/80 dark:border-border/60 hover:bg-background/90 dark:hover:bg-muted/60 focus-visible:bg-background dark:focus-visible:bg-muted/70 focus-visible:border-primary/60 dark:focus-visible:border-primary/50 text-foreground placeholder:text-muted-foreground/70 transition-all text-sm shadow-2xs"
      [class.border-destructive]="isInvalid()"
    />
  } @else {
    <input
      hlmInput
      type="text"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [value]="value()"
      (input)="onInput($event)"
      (keyup.enter)="enterPressed.emit()"
      class="w-full ps-9 pe-9 h-9.5 rounded-lg bg-background/70 dark:bg-muted/40 border border-border/80 dark:border-border/60 hover:bg-background/90 dark:hover:bg-muted/60 focus-visible:bg-background dark:focus-visible:bg-muted/70 focus-visible:border-primary/60 dark:focus-visible:border-primary/50 text-foreground placeholder:text-muted-foreground/70 transition-all text-sm shadow-2xs"
      [class.border-destructive]="isInvalid()"
    />
  }

  @if (hasValue()) {
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      class="text-muted-foreground hover:text-foreground hover:bg-muted/80 absolute end-1.5 h-6 w-6 rounded-md transition-colors focus:outline-none flex items-center justify-center"
      (click)="clearSearch()"
    >
      <span class="sr-only">Clear search</span>
      <ng-icon name="lucideX" class="h-3.5 w-3.5" />
    </button>
  }
</div>
