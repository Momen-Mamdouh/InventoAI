<div class="relative flex h-full w-full items-center">
  <ng-icon
    name="lucideSearch"
    class="text-muted-foreground pointer-events-none absolute start-3 z-10 h-4 w-4"
  />

  @if (control(); as ctrl) {
    <input
      hlmInput
      type="text"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [formControl]="ctrl"
      (keyup.enter)="enterPressed.emit()"
      class="w-full ps-9 pe-9"
      [class.border-destructive]="isInvalid()"
    />
  } @else {
    <input
      hlmInput
      type="text"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [value]="value()"
      (input)="onInput($event)"
      (keyup.enter)="enterPressed.emit()"
      class="w-full ps-9 pe-9"
      [class.border-destructive]="isInvalid()"
    />
  }

  @if (hasValue()) {
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      class="text-destructive hover:bg-destructive/10 hover:text-destructive absolute end-1 h-7 w-7 transition-colors focus:outline-none"
      (click)="clearSearch()"
    >
      <span class="sr-only">Clear search</span>
      <ng-icon name="lucideX" class="h-4 w-4" />
    </button>
  }
</div>
