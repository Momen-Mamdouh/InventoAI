<span class="inline">
  <span class="font-bold text-primary" [ngClass]="fontSizeClasses()">
    {{ displayText() }}
  </span>
  <span
    class="font-bold text-primary transition-opacity duration-100"
    [ngClass]="fontSizeClasses()"
    [class.opacity-0]="!showCursor()"
    [class.opacity-100]="showCursor()"
    >|</span
  >
</span>
