@if (variant() === 'shimmer') {
  <span
    hlmBadge
    class="z-10 relative bg-foreground text-background tracking-[0.15em] warm-badge"
    [style.--glow-color]="glowColor()"
    [style.--speed]="animationSpeed()"
  >
    {{ badgeText() | translate }}
  </span>
} @else {
  <span hlmBadge class="z-10 relative bg-foreground text-background tracking-[0.15em]">
    {{ badgeText() | translate }}
  </span>
}
