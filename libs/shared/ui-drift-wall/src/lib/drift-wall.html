<div
  #container
  class="drift-wall"
  [class.drift-wall--reduced]="reduced()"
  [class.drift-wall--pause-on-hover]="pauseOnHover()"
  [style.--dw-tile-w.px]="tileWidth()"
  [style.--dw-tile-h.px]="tileHeight()"
  [style.--dw-gap.px]="gap()"
  [style.--dw-radius.px]="radius()"
  [style.--dw-tilt.deg]="tilt()"
  [style.--dw-turn.deg]="turn()"
  [style.--dw-roll.deg]="roll()"
  [style.--dw-depth.px]="depth()"
  [style.--dw-perspective.px]="perspective()"
  [style.--dw-lift.px]="lift()"
  [style.--dw-dim]="dim()"
  [style.--dw-gray]="grayscale() ? 1 : 0"
  [style.--dw-overlay]="overlayColor()"
  [style.--dw-edge]="edgeValue()"
  role="group"
  aria-label="Drifting wall of tiles"
>
  <!-- Ambient Edge Vignette (Non-masking GPU accelerated) -->
  <div class="drift-wall__vignette" aria-hidden="true"></div>

  <div #plane class="drift-wall__plane">
    @for (col of columnItems(); track $index; let c = $index) {
      @let config = columnConfigs()[c];
      <div
        class="drift-wall__col"
        [class.drift-wall__col--up]="config.movesUp"
        [class.drift-wall__col--down]="!config.movesUp"
        [style.--col-duration.s]="config.duration"
        [style.--col-delay.s]="config.delay"
      >
        <div class="drift-wall__track">
          @for (copyIndex of [0, 1]; track copyIndex) {
            @for (item of col; track $index; let itemIndex = $index) {
              @if (item.href) {
                <a
                  [href]="item.href"
                  target="_blank"
                  rel="noreferrer noopener"
                  class="drift-wall__tile"
                  [class.is-active]="activeId() === c + '-' + copyIndex + '-' + itemIndex"
                  [attr.data-tile-id]="c + '-' + copyIndex + '-' + itemIndex"
                  (focus)="activate(c + '-' + copyIndex + '-' + itemIndex, c)"
                  (blur)="release()"
                >
                  <span class="drift-wall__inner">
                    <img
                      [src]="item.image"
                      [alt]="item.title || ''"
                      loading="lazy"
                      decoding="async"
                      draggable="false"
                    />
                    <span class="drift-wall__overlay" aria-hidden="true"></span>
                  </span>
                </a>
              } @else {
                <div
                  tabindex="0"
                  role="button"
                  [attr.aria-label]="item.title || 'tile'"
                  class="drift-wall__tile"
                  [class.is-active]="activeId() === c + '-' + copyIndex + '-' + itemIndex"
                  [attr.data-tile-id]="c + '-' + copyIndex + '-' + itemIndex"
                  (focus)="activate(c + '-' + copyIndex + '-' + itemIndex, c)"
                  (blur)="release()"
                >
                  <span class="drift-wall__inner">
                    <img
                      [src]="item.image"
                      [alt]="item.title || ''"
                      loading="lazy"
                      decoding="async"
                      draggable="false"
                    />
                    <span class="drift-wall__overlay" aria-hidden="true"></span>
                  </span>
                </div>
              }
            }
          }
        </div>
      </div>
    }
  </div>
</div>
