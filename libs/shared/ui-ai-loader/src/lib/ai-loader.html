@if (isNavigating()) {
  <div class="loader-overlay animate-in fade-in duration-300">
    <div class="flex flex-col items-center justify-center gap-8 text-center px-4">
      <div class="ai-loader-svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
          <defs>
            <filter id="aiLoaderShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow
                dx="1"
                dy="3"
                stdDeviation="4"
                flood-opacity="0.15"
                flood-color="#000000"
              />
            </filter>
          </defs>

          <g filter="url(#aiLoaderShadow)">
            <!-- Outer Border -->
            <path
              d="M 160 115 L 385 115 L 385 385 L 115 385 L 115 160"
              fill="none"
              stroke="currentColor"
              class="text-muted-foreground/30"
              stroke-width="30"
              stroke-linejoin="miter"
              stroke-linecap="butt"
            />

            <!-- Central 'N' -->
            <path
              d="M 180 320 L 180 180 L 320 320 L 320 180"
              fill="none"
              stroke="currentColor"
              class="text-foreground"
              stroke-width="32"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>

          <!-- Animated Dot -->
          <circle
            class="ai-loader-dot"
            cx="115"
            cy="115"
            r="38"
            fill="var(--primary, #307be8)"
            filter="url(#aiLoaderShadow)"
          />
        </svg>
      </div>

      <!-- Typewriter Animated Status Text -->
      <div
        class="flex items-center justify-center text-lg sm:text-xl font-mono font-medium text-foreground tracking-wide min-h-[2rem]"
      >
        <span>{{ displayText() }}</span>
        <span
          class="inline-block w-0.5 h-5 bg-primary ms-1.5 transition-opacity duration-100"
          [class.opacity-100]="showCursor()"
          [class.opacity-0]="!showCursor()"
        ></span>
      </div>
    </div>
  </div>
}
