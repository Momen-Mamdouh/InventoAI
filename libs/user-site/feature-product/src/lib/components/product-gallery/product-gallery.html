@let images = store.product()?.images ?? []; @let activeIdx = activeIndex();
@let active = activeImage(); @let name = store.product()?.title ?? '';

<div class="flex flex-col-reverse gap-3 md:flex-row">
  @if (images.length > 1) {
    <hlm-carousel
      class="relative w-full md:w-24 block"
      [orientation]="isDesktop() ? 'vertical' : 'horizontal'"
    >
      <div hlmCarouselContent class="pb-1 md:pb-0 h-96">
        @for (img of images; track img.url || $index; let i = $index) {
          <button
            hlmCarouselItem
            type="button"
            (click)="selectImage(i)"
            [attr.aria-pressed]="i === activeIdx"
            [attr.aria-label]="
              'product.gallery.view_image' | translate: { index: i + 1, name: name }
            "
            class="basis-auto h-20 w-20 shrink-0 overflow-hidden rounded-lg border-2 bg-card transition-colors md:h-24 md:w-full"
            [class.border-primary]="i === activeIdx"
            [class.border-border]="i !== activeIdx"
          >
            <img [src]="img.url" [alt]="img.altText || ''" class="h-full w-full object-cover" />
          </button>
        }
      </div>
      <button
        hlmCarouselPrevious
        class="hidden"
        [attr.aria-label]="'product.gallery.carousel_previous' | translate"
      ></button>
      <button
        hlmCarouselNext
        class="hidden"
        [attr.aria-label]="'product.gallery.carousel_next' | translate"
      ></button>
    </hlm-carousel>
  }

  <div
    class="group relative aspect-square grow overflow-hidden rounded-xl border border-border bg-card shadow-sm flex items-center justify-center cursor-zoom-in"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    @if (active) {
      <img
        [src]="active.url"
        [alt]="active.altText || ''"
        class="h-full w-full object-cover transition-transform duration-200 ease-out"
        [style.transform]="isZoomed() ? 'scale(2.5)' : 'scale(1)'"
        [style.transform-origin]="zoomOrigin()"
      />
    } @else {
      <div
        class="w-full h-full flex items-center justify-center text-muted-foreground/50 bg-secondary transition-transform duration-200 ease-out"
        [style.transform]="isZoomed() ? 'scale(2.5)' : 'scale(1)'"
        [style.transform-origin]="zoomOrigin()"
      >
        <ng-icon name="lucideImage" size="48" />
      </div>
    }
  </div>
</div>

<!-- Mo'men Comment: Why use @let instead of define it inside the ts file

Zero Boilerplate (Clean TypeScript): Variables like @let images = store.product()?.images ?? [] are purely "convenience aliases" so we
  don't have to repeatedly type store.product()?.images everywhere in the HTML. If we put this in the .ts file, we would have to write extra
  boilerplate like images = computed(() => this.store.product()?.images ?? []);. Using @let keeps your TypeScript file strictly focused on
  actual business logic and events, rather than cluttered with visual formatting variables.

Template-Local Scope: These variables are only needed for drawing the UI. By declaring them with @let right at the top of the HTML, you
  colocate the data directly next to the elements that consume it.

Perfect Reactivity: Because store.product() is an Angular Signal, the @let variable automatically acts as a reactive binding. Whenever
the store's product changes, the @let updates instantly and efficiently in the view. It replaces the old, messy Angular workaround of doing
ngIf="store.product() as product".


-->
