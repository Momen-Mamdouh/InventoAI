<div class="py-2 space-y-4">
  <div class="flex gap-3 items-stretch">
    <!-- Quantity Stepper -->
    <app-quantity-stepper class="shrink-0" />

    <!-- Primary Add to Cart Button -->
    <button
      hlmBtn
      size="lg"
      type="button"
      class="flex-1 h-11 md:h-12 rounded-xl text-sm md:text-base font-semibold shadow-md shadow-primary/15 hover:shadow-lg hover:shadow-primary/25 transition-all active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed disabled:shadow-none"
      [disabled]="!store.canAddToCart()"
      (click)="addToCart($event)"
      [attr.aria-label]="
        (store.canAddToCart() ? 'product.actions.add_to_cart' : 'product.actions.out_of_stock')
          | translate
      "
    >
      @if (store.canAddToCart()) {
        <ng-icon name="lucideShoppingCart" size="18" />
        <span>{{ 'product.actions.add_to_cart' | translate }}</span>
      } @else {
        <ng-icon name="lucideBan" size="18" />
        <span>{{ 'product.actions.out_of_stock' | translate }}</span>
      }
    </button>
  </div>
</div>
