<div
  class="flex items-center inline-flex bg-background border border-input rounded-md shadow-sm h-10"
>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    [disabled]="store.quantity() <= 1"
    (click)="store.decrement()"
    class="rounded-none rounded-l-md hover:bg-muted border-r border-input h-full w-10 shrink-0"
    [attr.aria-label]="'product.stepper.decrease' | translate"
  >
    <ng-icon name="lucideMinus" size="16" class="text-foreground" />
  </button>

  <span
    class="flex w-12 items-center justify-center text-sm font-medium text-foreground h-full"
    aria-live="polite"
  >
    {{ store.quantity() }}
  </span>

  <button
    hlmBtn
    variant="ghost"
    size="icon"
    (click)="store.increment()"
    class="rounded-none rounded-r-md hover:bg-muted border-l border-input h-full w-10 shrink-0"
    [attr.aria-label]="'product.stepper.increase' | translate"
  >
    <ng-icon name="lucidePlus" size="16" class="text-foreground" />
  </button>
</div>
