<section class="px-4 sm:px-8 md:px-16 lg:px-24 pt-4 pb-10">
  <app-products-toolbar
    [title]="'product.products.title' | translate"
    [count]="productsResponse()?.total || 0"
    [sort]="currentSort()"
    (sortChange)="onSortChange($event)"
    (searchSubmit)="onSearchSubmit($event)"
  />

  @let dym = didYouMean();
  @if (searchMode() === 'fuzzy' && dym) {
    <div
      class="mt-4 p-4 bg-primary/10 text-primary rounded-lg border border-primary/20 flex items-center gap-2"
    >
      <ng-icon name="lucideInfo" class="w-5 h-5"></ng-icon>
      <span [innerHTML]="'product.products.did_you_mean' | translate: { term: dym }"></span>
    </div>
  }

  <div class="flex md:flex-row flex-col gap-10 mt-6">
    <aside class="w-full md:w-64 shrink-0">
      <app-filters-sidebar
        [filters]="filterResponse()"
        [isLoading]="isLoading()"
        (categoryChange)="onCategoryChange($event)"
        (priceChange)="onPriceChange($event)"
        (inStockChange)="onInStockChange($event)"
        (attributeChange)="onAttributeChange($event)"
        (clearAll)="onClearAll()"
      />
    </aside>

    <div class="flex flex-col flex-1 gap-6 relative min-h-100">
      <div class="products-grid-wrapper px-1 py-2 overflow-x-hidden">
        @if (isLoading()) {
          <div class="items-stretch gap-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
            @for (i of [1, 2, 3, 4, 5, 6]; track i) {
              <div class="flex flex-col gap-3 h-full">
                <app-skeleton-block class="aspect-4/5 w-full rounded-xl" />
                <div class="space-y-2 mt-2">
                  <app-skeleton-block class="h-4 w-3/4" />
                  <app-skeleton-block class="h-4 w-1/2" />
                  <div class="flex gap-2 mt-4">
                    <app-skeleton-block class="h-6 w-12 rounded-full" />
                    <app-skeleton-block class="h-6 w-12 rounded-full" />
                  </div>
                </div>
              </div>
            }
          </div>
        } @else if (productsResponse()?.items?.length) {
          <app-products-grid [products]="productsResponse()?.items || []" />
        } @else {
          <div class="py-10">
            <app-empty-state
              icon="lucideSearchX"
              [title]="'product.products.no_products' | translate"
              [description]="'product.products.no_products_desc' | translate"
            >
              <button hlmBtn (click)="onClearAll()">
                {{ 'product.products.clear_all' | translate }}
              </button>
            </app-empty-state>
          </div>
        }
      </div>

      @if (productsResponse()?.totalPages && productsResponse()!.totalPages > 1) {
        <app-pagination
          [currentPage]="productsResponse()!.page"
          [totalPages]="productsResponse()!.totalPages"
          [totalItems]="productsResponse()!.total"
          [pageSize]="productsResponse()!.limit"
          (pageChange)="onPageChange($event)"
        />
      }
    </div>
  </div>
</section>
