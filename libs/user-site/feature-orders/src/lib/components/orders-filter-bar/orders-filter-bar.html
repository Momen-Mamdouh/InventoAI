<section class="mb-8 lg:sticky lg:top-20 lg:z-10">
  <div
    hlmCard
    class="flex flex-col justify-between gap-4 p-4 shadow-sm lg:flex-row lg:items-center lg:shadow-md lg:backdrop-blur-sm"
  >
    <!-- Search bar: first on mobile (top), pushed to end on desktop -->
    <div class="w-full shrink-0 lg:w-72 xl:w-80 lg:order-last">
      <app-search-input
        [value]="ordersService.searchQuery()"
        (valueChange)="onSearchChange($event)"
        [placeholder]="'orders.search_placeholder' | translate"
        [ariaLabel]="'orders.search_aria' | translate"
      />
    </div>

    <app-filter-tabs
      class="w-full min-w-0 lg:w-auto"
      [tabs]="tabs()"
      [active]="ordersService.selectedFilter()"
      [ariaLabel]="'orders.filter_aria' | translate"
      (tabChange)="onFilterChange($event)"
    />
  </div>
</section>
