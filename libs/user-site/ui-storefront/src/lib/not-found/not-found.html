<div
  class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden bg-background"
>
  <!-- Glowing Background Blobs -->
  <div
    #floatingShape
    class="absolute w-[30rem] h-[30rem] bg-primary/20 rounded-full blur-[100px] -top-20 -left-20 pointer-events-none"
  ></div>
  <div
    #floatingShape
    class="absolute w-[25rem] h-[25rem] bg-secondary/40 rounded-full blur-[80px] bottom-0 right-10 pointer-events-none"
  ></div>

  <!-- Abstract Geometric Shapes -->
  <svg
    #floatingShape
    class="absolute top-1/4 right-1/4 w-12 h-12 text-primary opacity-50"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
  >
    <circle cx="12" cy="12" r="10" stroke-width="2"></circle>
  </svg>
  <svg
    #floatingShape
    class="absolute bottom-1/3 left-1/4 w-16 h-16 text-muted-foreground opacity-30"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
  >
    <polygon points="12 2 22 20 2 20" stroke-width="1.5"></polygon>
  </svg>

  <!-- Main Content -->
  <div class="z-10 flex flex-col items-center text-center relative px-6">
    <!-- Layered 404 Text Effect -->
    <div #contentReveal class="relative inline-block mb-8">
      <h1
        class="text-[10rem] md:text-[15rem] font-bold leading-none text-transparent opacity-20 absolute -top-12 md:-top-16 left-0 select-none"
        style="-webkit-text-stroke: 3px var(--color-primary)"
      >
        404
      </h1>
      <h1
        class="text-[10rem] md:text-[15rem] font-bold leading-none text-primary relative z-10 select-none"
      >
        404
      </h1>
      <h1
        class="text-[10rem] md:text-[15rem] font-bold leading-none text-transparent opacity-20 absolute -bottom-12 md:-bottom-16 left-0 select-none"
        style="-webkit-text-stroke: 3px var(--color-primary)"
      >
        404
      </h1>
    </div>

    <!-- Typography & Button -->
    <p hlmMuted #contentReveal class="font-mono uppercase mb-2">
      {{ 'not_found.label' | translate }}
    </p>
    <h2 hlmH2 #contentReveal class="text-foreground mb-4 mt-2">
      {{ 'not_found.title' | translate }}
    </h2>

    <p hlmMuted #contentReveal class="mb-10 max-w-md mx-auto">
      {{ 'not_found.description' | translate }}
    </p>

    <div #contentReveal>
      <a
        routerLink="/"
        hlmBtn
        variant="default"
        class="font-mono uppercase tracking-wider text-xs px-8 py-6 shadow-md hover:scale-105 transition-transform duration-300"
      >
        {{ 'not_found.action' | translate }}
      </a>
    </div>
  </div>
</div>
