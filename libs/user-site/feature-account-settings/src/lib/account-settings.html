<div class="mx-auto flex max-w-6xl flex-col gap-8 p-4 sm:p-6 lg:p-8">
  <!-- Account Hero Banner -->
  <header
    class="relative overflow-hidden rounded-3xl border border-border/70 bg-gradient-to-br from-primary/10 via-primary/5 to-card/60 p-6 sm:p-8 backdrop-blur-xs shadow-xs"
  >
    <div
      class="inline-flex items-center gap-2 rounded-full border border-primary/25 bg-primary/10 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-primary"
    >
      <ng-icon name="lucideSparkles" size="14" />
      <span>{{ 'account_settings.badge' | translate }}</span>
    </div>

    <h1 class="mt-3 text-2xl sm:text-3xl font-bold tracking-tight text-foreground">
      {{ 'account_settings.title' | translate }}
    </h1>
    <p class="mt-1 text-sm sm:text-base text-muted-foreground max-w-2xl">
      {{ 'account_settings.subtitle' | translate }}
    </p>
  </header>

  <!-- Main Content Grid with Sidebar -->
  <div class="flex flex-col items-stretch md:flex-row md:items-start gap-6 lg:gap-8">
    <app-account-settings-sidebar />
    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>
</div>
