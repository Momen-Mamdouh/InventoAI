name: Verify

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NX_NO_CLOUD: 'true'

jobs:
  naming-and-lint:
    name: Lint & Naming Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check project names follow the naming scheme
        run: npm run check:names

      - name: Lint
        run: npx nx run-many -t lint --parallel=4

  typecheck:
    name: TypeScript Compiler Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit, Integration & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run tests with coverage for siteBuilder app
        run: npm test -- --coverage

      - name: Run tests with coverage for userSite app
        run: npm run test:user-site -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-builder-coverage
          path: coverage/site-builder/
          if-no-files-found: ignore

  build:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build all projects
        run: npm run build:all

  verify-all:
    name: All Verification Gates
    needs: [naming-and-lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          if [ "${{ needs.naming-and-lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more verification gates failed."
            exit 1
          fi
          echo "All verification gates passed successfully."
