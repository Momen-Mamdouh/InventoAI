<nav
  class="fixed top-4 md:top-6 left-1/2 -translate-x-1/2 z-50 w-[95%] max-w-6xl rounded-full border border-border/40 bg-background/60 backdrop-blur-xl shadow-2xl transition-all duration-300"
>
  <div class="flex h-16 w-full items-center justify-between px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      hlmBtn
      variant="ghost"
      class="group h-auto p-2 flex items-center gap-2"
      aria-label="INVENTO Home Page"
    >
      <img src="light-logo.png" class="h-13 w-auto dark:hidden block" alt="INVENTO Logo" />
      <img src="logo.png" class="h-13 w-auto hidden dark:block" alt="INVENTO Logo" />
    </a>

    <div class="flex items-center gap-4">
      <app-lang-switcher />
      <app-theme-switcher />

      @if (isAuthenticated()) {
        <a [href]="dashboardUrl" hlmBtn variant="outline" class="gap-2">
          <ng-icon name="lucideLayoutDashboard" class="text-sm"></ng-icon>
          {{ 'nav_dashboard' | translate }}
        </a>
        <button hlmBtn variant="ghost" class="gap-2" (click)="signOut()">
          <ng-icon name="lucideLogOut" class="text-sm"></ng-icon>
          {{ 'nav_sign_out' | translate }}
        </button>
      } @else {
        <a routerLink="/auth/login" hlmBtn variant="ghost">{{ 'nav_login' | translate }}</a>
        <a routerLink="/auth/register" hlmBtn>{{ 'nav_sign_up' | translate }}</a>
      }
    </div>
  </div>
</nav>
