<section
  class="relative flex flex-col items-center justify-center min-h-[85vh] mx-auto px-4 sm:px-8 md:px-16 lg:px-24 py-20 max-w-7xl overflow-hidden"
>
  <!-- Background Glow / Grid -->
  <div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
    <div
      class="absolute w-[800px] h-[800px] bg-primary/10 rounded-full blur-[120px] opacity-70"
    ></div>
    <div
      class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)]"
    ></div>
  </div>

  <div class="relative z-10 flex flex-col items-center text-center gap-8 w-full max-w-4xl mx-auto">
    <!-- Massive Typography -->
    <h1 class="flex flex-col gap-2 leading-tight tracking-tighter" [class]="hlmH1">
      <span appScrollAnimate="fade-up" [animDelay]="100" class="block mb-4 md:mb-6">
        <span
          class="inline-block pb-[0.2em] -mb-[0.2em] font-extrabold text-foreground text-5xl md:text-7xl lg:text-8xl bg-clip-text text-transparent bg-gradient-to-b from-foreground to-foreground/70"
        >
          {{ 'hero_title' | translate }}
        </span>
      </span>
      <span
        appScrollAnimate="fade-up"
        [animDelay]="200"
        class="block min-h-[1.2em] font-medium text-3xl md:text-5xl lg:text-6xl text-primary"
      >
        <app-blur-text [texts]="welcomeWords" />
      </span>
    </h1>

    <p
      appScrollAnimate="fade-up"
      [animDelay]="300"
      class="max-w-2xl text-muted-foreground text-lg md:text-xl leading-relaxed font-medium"
      [class]="hlmP"
    >
      {{ 'hero_desc' | translate }}
    </p>

    <!-- Action Buttons -->
    <div
      appScrollAnimate="fade-up"
      [animDelay]="400"
      class="flex flex-col sm:flex-row items-center gap-4 mt-6"
    >
      <a
        hlmBtn
        routerLink="/build"
        class="justify-center gap-2 w-full sm:w-auto !rounded-full !px-8 !py-6 text-base font-semibold shadow-lg shadow-primary/20 hover:scale-105 transition-transform"
      >
        <ng-icon name="lucideBolt" />
        {{ 'hero_btn' | translate }}
        <ng-icon name="lucideChevronRight" />
      </a>
    </div>
  </div>

  <!-- Abstract Glassmorphic Visualization -->
  <div
    appScrollAnimate="fade-up"
    [animDelay]="600"
    class="relative z-10 w-full max-w-5xl mt-20 perspective-1000"
  >
    <div
      class="relative rounded-2xl border border-border/50 bg-background/40 backdrop-blur-xl shadow-2xl overflow-hidden transform hover:-translate-y-2 transition-transform duration-700"
    >
      <!-- Browser Header -->
      <div class="flex items-center gap-2 px-4 py-3 border-b border-border/50 bg-muted/20">
        <div class="flex gap-1.5">
          <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <div
          class="mx-auto px-6 py-1 rounded-md bg-muted/30 text-xs font-mono text-muted-foreground"
        >
          site-builder.invento.ai
        </div>
      </div>

      <!-- Abstract Content Grid (Bento Style Preview) -->
      <div
        class="grid grid-cols-12 gap-4 p-6 md:p-8 bg-gradient-to-b from-transparent to-muted/10 h-[300px] md:h-[400px]"
      >
        <!-- Sidebar Mock -->
        <div
          class="col-span-3 rounded-xl border border-border/40 bg-card/30 flex flex-col gap-3 p-4"
        >
          <div class="w-full h-8 rounded-lg bg-primary/20 animate-pulse"></div>
          <div class="w-3/4 h-4 rounded-md bg-muted/50 mt-4"></div>
          <div class="w-1/2 h-4 rounded-md bg-muted/50"></div>
          <div class="w-2/3 h-4 rounded-md bg-muted/50"></div>
        </div>

        <!-- Main Content Mock -->
        <div class="col-span-9 flex flex-col gap-4">
          <!-- Top Row -->
          <div class="grid grid-cols-3 gap-4 h-24">
            <div
              class="col-span-1 rounded-xl border border-border/40 bg-card/30 flex items-center p-4"
            >
              <div class="w-10 h-10 rounded-full bg-blue-500/20 flex-shrink-0"></div>
              <div class="ml-3 flex flex-col gap-2 w-full">
                <div class="w-1/2 h-3 rounded bg-muted/60"></div>
                <div class="w-3/4 h-2 rounded bg-muted/40"></div>
              </div>
            </div>
            <div
              class="col-span-1 rounded-xl border border-border/40 bg-card/30 flex items-center p-4"
            >
              <div class="w-10 h-10 rounded-full bg-green-500/20 flex-shrink-0"></div>
              <div class="ml-3 flex flex-col gap-2 w-full">
                <div class="w-1/2 h-3 rounded bg-muted/60"></div>
                <div class="w-3/4 h-2 rounded bg-muted/40"></div>
              </div>
            </div>
            <div
              class="col-span-1 rounded-xl border border-border/40 bg-card/30 flex items-center p-4"
            >
              <div class="w-10 h-10 rounded-full bg-primary/20 flex-shrink-0"></div>
              <div class="ml-3 flex flex-col gap-2 w-full">
                <div class="w-1/2 h-3 rounded bg-muted/60"></div>
                <div class="w-3/4 h-2 rounded bg-muted/40"></div>
              </div>
            </div>
          </div>
          <!-- Hero Mock inside Preview -->
          <div
            class="flex-1 rounded-xl border border-border/40 bg-card/30 p-6 flex items-center justify-center overflow-hidden relative"
          >
            <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent"></div>
            <div class="text-center z-10 flex flex-col items-center gap-4">
              <div class="w-48 h-8 rounded-lg bg-foreground/10"></div>
              <div class="w-64 h-4 rounded-md bg-muted/50"></div>
              <div class="w-32 h-10 rounded-full bg-primary/20 mt-2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
