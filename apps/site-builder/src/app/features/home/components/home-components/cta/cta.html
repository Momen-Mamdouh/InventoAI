<section class="px-4 sm:px-8 md:px-16 lg:px-24 py-20 w-full max-w-7xl mx-auto">
  <div
    class="relative w-full rounded-3xl overflow-hidden bg-foreground text-background p-10 md:p-20 text-center flex flex-col items-center justify-center isolate"
  >
    <!-- Deep glowing background effects -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
      <div
        class="absolute -top-[200px] -right-[200px] w-[500px] h-[500px] rounded-full bg-primary/20 blur-[100px]"
      ></div>
      <div
        class="absolute -bottom-[200px] -left-[200px] w-[500px] h-[500px] rounded-full bg-primary/20 blur-[100px]"
      ></div>
      <div
        class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')] opacity-20 mask-image:linear-gradient(to_bottom,transparent,black,transparent)"
      ></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center gap-6 max-w-3xl">
      <h2
        appScrollAnimate="fade-up"
        [animDelay]="100"
        class="font-extrabold text-4xl md:text-5xl lg:text-7xl tracking-tighter leading-tight"
      >
        {{ 'cta_title' | translate }}
        <span class="block text-primary drop-shadow-md">{{ 'cta_title_accent' | translate }}</span>
      </h2>

      <p
        appScrollAnimate="fade-up"
        [animDelay]="200"
        class="text-background/80 text-lg md:text-xl font-medium max-w-2xl leading-relaxed mt-2"
      >
        {{ 'cta_desc' | translate }}
      </p>

      <div appScrollAnimate="zoom-in" [animDelay]="300" class="mt-8">
        <a
          hlmBtn
          routerLink="/build"
          class="gap-3 !rounded-full !px-10 !py-8 text-lg font-bold bg-primary hover:bg-primary/90 text-primary-foreground shadow-2xl shadow-primary/25 hover:scale-105 hover:-translate-y-1 transition-all duration-300"
        >
          <ng-icon name="lucideBolt" size="24" />
          {{ 'cta_btn' | translate }}
        </a>
      </div>
    </div>
  </div>
</section>
