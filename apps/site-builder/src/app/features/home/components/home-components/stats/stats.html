<section class="mx-auto my-20 px-4 sm:px-8 md:px-16 lg:px-24 w-full max-w-7xl">
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 relative">
    <!-- Background Glow -->
    <div class="absolute inset-0 bg-primary/5 blur-3xl rounded-full z-0 pointer-events-none"></div>

    @for (stat of displayStats(); track stat.label; let i = $index) {
      <div
        appScrollAnimate="fade-up"
        [animDelay]="i * 100"
        class="relative z-10 flex flex-col items-center sm:items-start gap-3 p-6 sm:p-8 rounded-2xl bg-card/40 backdrop-blur-md border border-border/50 shadow-sm hover:shadow-md hover:border-primary/30 transition-all duration-300 group"
      >
        <span
          class="flex items-center gap-2 font-mono font-bold tabular-nums text-foreground text-4xl group-hover:text-primary transition-colors"
        >
          @if (stat.standaloneIcon) {
            <ng-icon
              [name]="stat.standaloneIcon"
              size="36"
              class="text-primary/80 group-hover:text-primary transition-colors"
            />
          } @else {
            @if (stat.prefixIcon) {
              <ng-icon
                [name]="stat.prefixIcon"
                size="24"
                class="text-primary/60 group-hover:text-primary transition-colors"
              />
            }
            {{ stat.value }}
            @if (stat.suffixIcon) {
              <ng-icon
                [name]="stat.suffixIcon"
                size="24"
                class="text-primary/60 group-hover:text-primary transition-colors"
              />
            }
            @if (stat.suffixText) {
              <span
                class="text-2xl text-muted-foreground group-hover:text-primary/80 transition-colors"
                >{{ stat.suffixText | translate }}</span
              >
            }
          }
        </span>
        <span
          class="text-muted-foreground text-sm font-medium uppercase tracking-wider group-hover:text-foreground transition-colors"
          >{{ stat.label | translate }}</span
        >
      </div>
    }
  </div>
</section>
