<section class="px-4 sm:px-8 md:px-16 lg:px-24 py-20 w-full max-w-7xl mx-auto">
  <div class="flex flex-col gap-12">
    <!-- Section Header -->
    <div
      appScrollAnimate="fade-up"
      [animDelay]="0"
      class="flex flex-col gap-4 text-center items-center"
    >
      <div
        class="px-4 py-1.5 rounded-full bg-primary/10 border border-primary/20 text-primary text-sm font-medium w-fit"
      >
        {{ 'caps_header' | translate }}
      </div>
      <h2 class="text-3xl md:text-5xl font-bold tracking-tight text-foreground">
        {{ 'caps_title' | translate }}
      </h2>
    </div>

    <!-- Bento Grid -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 relative">
      <!-- Glow -->
      <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-primary/10 blur-[100px] rounded-full z-0 pointer-events-none"
      ></div>

      @for (cap of capabilities(); track cap.title; let i = $index) {
        <a
          [routerLink]="cap.link"
          appScrollAnimate="fade-up"
          [animDelay]="i * 100"
          class="relative z-10 flex flex-col justify-between overflow-hidden rounded-3xl border border-border/50 bg-card/40 backdrop-blur-md p-8 sm:p-10 hover:border-primary/40 hover:shadow-2xl hover:shadow-primary/5 transition-all duration-500 group min-h-[300px]"
          [class.md:col-span-7]="i === 0 || i === 3"
          [class.md:col-span-5]="i === 1 || i === 2"
        >
          <!-- Gradient Hover Effect -->
          <div
            class="absolute inset-0 bg-gradient-to-br from-primary/0 to-primary/0 group-hover:from-primary/5 group-hover:to-transparent transition-all duration-500 z-0 pointer-events-none"
          ></div>

          <div class="relative z-10">
            <div
              class="flex justify-center items-center rounded-2xl w-14 h-14 bg-background border border-border/50 text-foreground group-hover:text-primary group-hover:scale-110 transition-all duration-300 shadow-sm mb-6"
            >
              <ng-icon [name]="cap.icon" size="24" />
            </div>

            <h3
              class="font-bold text-2xl tracking-tight text-foreground mb-3 group-hover:text-primary transition-colors"
            >
              {{ cap.title | translate }}
            </h3>

            <p class="text-muted-foreground text-base leading-relaxed font-medium">
              {{ cap.description | translate }}
            </p>
          </div>
        </a>
      }
    </div>
  </div>
</section>
