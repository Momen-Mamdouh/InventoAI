<section
  class="flex flex-col items-center gap-12 px-4 sm:px-8 md:px-16 lg:px-24 py-20 w-full max-w-7xl mx-auto"
>
  <app-page-header badgeText="pipeline_badge" title="" accentTitle=""></app-page-header>

  <!-- Flow / Timeline -->
  <div class="relative w-full mt-10">
    <!-- Connecting Line (Desktop) -->
    <div
      class="hidden lg:block absolute top-[40px] left-[10%] right-[10%] h-[2px] bg-border/50 z-0"
    >
      <div
        class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/50 to-transparent w-1/2 animate-[pulse_3s_ease-in-out_infinite]"
      ></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 relative z-10 w-full">
      @for (step of steps(); track step.number; let i = $index) {
        <a
          hlmCard
          appScrollAnimate="fade-up"
          [animDelay]="i * 120"
          routerLink="/build"
          class="relative flex flex-col pt-8 hover:shadow-2xl hover:shadow-primary/5 border border-border/40 bg-card/40 backdrop-blur-md text-center no-underline transition-all duration-500 cursor-pointer pipeline-card group rounded-2xl"
          (mousemove)="onMouseMove($event)"
          (mouseleave)="onMouseLeave($event)"
        >
          <!-- Glow layer -->
          <div
            class="absolute inset-0 opacity-0 rounded-2xl transition-opacity duration-300 pointer-events-none pipeline-glow overflow-hidden"
          ></div>

          <!-- Number Indicator -->
          <div
            class="absolute -top-6 start-1/2 -translate-x-1/2 rtl:translate-x-1/2 w-16 h-16 rounded-full bg-background border border-border/50 flex items-center justify-center shadow-lg group-hover:scale-110 group-hover:border-primary/50 transition-all duration-300 z-20"
          >
            <span
              class="font-mono font-bold text-transparent bg-clip-text bg-gradient-to-br from-foreground to-foreground/50 text-2xl group-hover:from-primary group-hover:to-primary/50 transition-all"
            >
              {{ step.number | translate }}
            </span>
          </div>

          <div hlmCardHeader class="relative flex flex-col items-center gap-3 p-8 pt-10">
            <div
              class="w-10 h-1 rounded-full bg-primary/20 group-hover:bg-primary group-hover:w-16 transition-all duration-300"
            ></div>
            <h3
              hlmCardTitle
              class="font-semibold text-xl tracking-tight text-foreground group-hover:text-primary transition-colors"
            >
              {{ step.title | translate }}
            </h3>
            <p
              hlmCardDescription
              class="text-sm text-muted-foreground/80 leading-relaxed font-medium"
            >
              {{ step.subtitle | translate }}
            </p>
          </div>
        </a>
      }
    </div>
  </div>
</section>
