<div class="flex flex-col h-full">
  <div class="mb-8 text-center">
    <h1 class="text-3xl font-bold tracking-tight mb-2">
      Welcome Back
    </h1>
    <p class="text-sm text-muted-foreground">
      Don't have an account?
      <a
        routerLink="../register"
        queryParamsHandling="merge"
        class="font-medium text-primary hover:underline"
        >Sign up</a
      >
    </p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5">
      <label hlmLabel for="email" class="text-sm font-semibold"
        >Email Address</label
      >
      <input
        hlmInput
        id="email"
        type="email"
        formControlName="email"
        (blur)="loginForm.get('email')?.markAsTouched()"
        placeholder="Email Address"
        class="w-full px-4 !py-6 text-base !rounded-xl"
      />
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
        <div class="text-xs text-destructive mt-1">Please enter a valid email address.</div>
      }
    </div>

    <div class="space-y-1.5">
      <label hlmLabel for="password" class="text-sm font-semibold"
        >Password</label
      >
      <input
        hlmInput
        id="password"
        type="password"
        formControlName="password"
        (blur)="loginForm.get('password')?.markAsTouched()"
        placeholder="Password"
        class="w-full px-4 !py-6 text-base !rounded-xl"
      />
      @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <div class="text-xs text-destructive mt-1">Password is required.</div>
      }
      <div class="flex items-center justify-end pt-1">
        <a
          routerLink="../forgot-password"
          queryParamsHandling="merge"
          class="text-xs font-semibold text-primary hover:underline"
          >Forgot password?</a
        >
      </div>
    </div>

    <button
      hlmBtn
      class="w-full mt-8 !py-6 text-base font-semibold !rounded-full hover:scale-[1.02] hover:shadow-md active:scale-[0.98] transition-all duration-200"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>Sign In</span>
      } @else {
        <span>Signing in...</span>
      }
    </button>
  </form>
</div>
