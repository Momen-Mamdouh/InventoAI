<div class="flex flex-col gap-8 mx-auto p-8 max-w-6xl">
  <header>
    <h1 hlmH1 class="text-2xl font-semibold">{{ 'account_settings.title' | translate }}</h1>
    <p hlmMuted>{{ 'account_settings.subtitle' | translate }}</p>
  </header>

  <div class="flex md:flex-row flex-col items-stretch md:items-start gap-6 md:gap-8">
    <app-account-settings-sidebar />
    <div class="flex-1 min-w-0">
      <router-outlet />

  <button
