@if (products().length) {
  <section class="mt-12 border-t border-border pt-12">
    <hlm-carousel
      orientation="horizontal"
      class="w-full flex flex-col-reverse max-w-5xl mx-auto overflow-hidden"
      [options]="{ align: 'start', loop: true }"
    >
      <div class="flex items-center justify-between mb-6">
        <h2 hlmH2 class="text-xl font-semibold text-foreground m-0 border-none">
          {{ 'product.recommended.title' | translate }}
        </h2>
        <div class="flex items-center gap-2">
          <button
            hlmCarouselPrevious
            class="static translate-y-0 flex"
            [attr.aria-label]="'product.recommended.previous_slide' | translate"
          ></button>
          <button
            hlmCarouselNext
            class="static translate-y-0 flex"
            [attr.aria-label]="'product.recommended.next_slide' | translate"
          ></button>
        </div>
      </div>

      <div hlmCarouselContent class="p-1 h-full" [class.justify-center]="products().length <= 2">
        @for (product of products(); track product.slug) {
          <div hlmCarouselItem class="basis-full sm:basis-1/2 lg:basis-1/3 xl:basis-[27%]">
            <app-product-card [product]="product" />
          </div>
        }
      </div>
    </hlm-carousel>
  </section>
}
