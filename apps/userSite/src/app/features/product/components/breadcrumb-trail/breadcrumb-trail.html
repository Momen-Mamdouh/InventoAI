<nav hlmBreadcrumb [attr.aria-label]="'product.breadcrumb.nav_label' | translate" class="mb-4">
  <ul
    hlmBreadcrumbList
    class="flex items-center gap-1.5 break-words text-sm text-muted-foreground sm:gap-2.5"
  >
    <li hlmBreadcrumbItem class="inline-flex items-center gap-1.5">
      <a hlmBreadcrumbLink [routerLink]="['/', storeSlug(), 'products']">
        {{ 'product.breadcrumb.shop' | translate }}
      </a>
      <span hlmBreadcrumbSeparator class="flex items-center"></span>
    </li>
    @if (store.product(); as product) {
      @if (product.categories && product.categories.length > 0) {
        <li hlmBreadcrumbItem class="hidden md:inline-flex items-center gap-1.5">
          <a
            hlmBreadcrumbLink
            [routerLink]="['/', storeSlug(), 'products']"
            [queryParams]="{ category: product.categories[0].slug }"
          >
            {{ product.categories[0]?.name }}
          </a>
        </li>
        <li hlmBreadcrumbItem class="md:hidden inline-flex items-center gap-1.5">
          <span hlmBreadcrumbEllipsis></span>
        </li>
        <span hlmBreadcrumbSeparator class="flex items-center"></span>
      }
      <li hlmBreadcrumbItem class="inline-flex items-center gap-1.5">
        <span hlmBreadcrumbPage class="text-foreground font-semibold">{{ product.title }}</span>
      </li>
    }
  </ul>
</nav>
