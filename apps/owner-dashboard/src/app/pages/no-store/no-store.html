<div class="flex flex-col min-h-screen bg-background text-foreground">
  <!-- Minimal Header (No Sidebar) -->
  <header
    class="flex items-center justify-between h-20 px-6 sm:px-10 border-b border-border/40 bg-card/80 backdrop-blur-xl shrink-0"
  >
    <div class="flex items-center gap-3">
      <img
        [src]="isDark() ? '/logo.png' : '/light-logo.png'"
        [attr.alt]="'app_name' | translate"
        class="h-8 sm:h-9 w-auto object-contain"
      />
    </div>

    <div class="flex items-center gap-2">
      <!-- System Controls: Language & Theme -->
      <app-lang-switcher />
      <app-theme-switcher />

      <!-- Vertical Glass Divider -->
      <div class="h-4 w-px bg-border/60 mx-0.5 sm:mx-1" aria-hidden="true"></div>

      <!-- Logout Button -->
      <app-sign-out-button />
    </div>
  </header>

  <!-- Empty State Body -->
  <main class="flex flex-col justify-center items-center flex-1 p-6 sm:p-10 text-center">
    <div
      hlmCard
      class="relative flex flex-col items-center max-w-lg w-full !p-8 sm:!p-12 animate-in fade-in zoom-in duration-300"
    >
      <div
        class="flex justify-center items-center w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-primary/10 text-primary border border-primary/20 shadow-xs"
      >
        <ng-icon name="lucideStore" size="42" />
      </div>

      <div class="space-y-3">
        <h1 hlmH1 class="text-foreground">
          {{ 'home.no_store_title' | translate }}
        </h1>
        <p hlmMuted class="max-w-sm mx-auto">
          {{ 'home.no_store_desc' | translate }}
        </p>
      </div>

      <div class="pt-2 w-full sm:w-auto">
        <a
          hlmBtn
          [href]="siteBuilderUrl()"
          class="inline-flex items-center justify-center gap-2.5 px-8 py-3 rounded-xl bg-primary text-primary-foreground hover:bg-primary/90 font-semibold text-sm sm:text-base transition-all duration-200 shadow-md shadow-primary/20 w-full sm:w-auto cursor-pointer"
        >
          <ng-icon name="lucidePlus" size="20" />
          <span>{{ 'home.build_store_cta' | translate }}</span>
        </a>
      </div>
    </div>
  </main>
</div>
