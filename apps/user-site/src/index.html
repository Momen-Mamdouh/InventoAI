<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>user Site</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="icon.png" />
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)invento_theme=([^;]+)/);
          var theme = match ? decodeURIComponent(match[1]) : null;
          if (theme !== 'dark' && theme !== 'light') {
            theme = localStorage.getItem('invento_theme');
          }
          if (theme !== 'dark' && theme !== 'light') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          if (localStorage.getItem('theme')) {
            localStorage.removeItem('theme');
          }

          // Pre-hydrate store theme stylesheet to eliminate color flashing (FOUC)
          var existingTheme = document.getElementById('store-theme');
          if (!existingTheme) {
            var host = window.location.hostname || '';
            var nonTenant = { www: 1, localhost: 1, app: 1, api: 1 };
            var slug = '';
            var hostLabels = host.split('.');
            if (hostLabels.length >= 3 && !nonTenant[hostLabels[0].toLowerCase()]) {
              slug = hostLabels[0].toLowerCase();
            }
            if (!slug) {
              var pathSegments = (window.location.pathname || '').split('/').filter(Boolean);
              if (pathSegments.length > 0 && pathSegments[0] !== 'store-not-found') {
                slug = pathSegments[0].toLowerCase();
              }
            }
            if (slug && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
              var cachedCss = localStorage.getItem('invento_store_theme:' + slug);
              if (cachedCss) {
                var styleEl = document.createElement('style');
                styleEl.id = 'store-theme';
                styleEl.setAttribute('data-slug', slug);
                styleEl.textContent = cachedCss;
                document.head.appendChild(styleEl);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
