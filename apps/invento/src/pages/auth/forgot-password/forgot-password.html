<div class="flex flex-col h-full text-left">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">
      {{ 'auth_forgot_page_title' | translate }}
    </h1>
    <p class="text-sm text-slate-500 dark:text-zinc-400">
      {{ 'auth_forgot_desc' | translate }}
    </p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-5 flex-1">
    <div class="space-y-1.5">
      <label hlmLabel for="email" class="text-sm font-semibold text-slate-700 dark:text-white">{{
        'auth_usersite_login_email' | translate
      }}</label>
      <input
        hlmInput
        id="email"
        type="email"
        formControlName="email"
        placeholder="Email Address"
        class="w-full px-4 !py-6 text-base"
      />
      @if (forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid) {
        <div class="text-xs text-red-500 mt-1">{{ 'auth_email_error' | translate }}</div>
      }
    </div>

    <button
      hlmBtn
      class="w-full mt-8 !py-6 text-base font-semibold"
      type="submit"
      [disabled]="isLoading()"
    >
      @if (!isLoading()) {
        <span>{{ 'auth_usersite_forgot_btn' | translate }}</span>
      } @else {
        <span>{{ 'auth_forgot_sending' | translate }}</span>
      }
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-8">
    {{ 'auth_remember_pwd' | translate }}
    <a routerLink="/auth/login" class="font-bold text-blue-500 hover:underline">{{
      'auth_log_in_link' | translate
    }}</a>
  </p>
</div>
