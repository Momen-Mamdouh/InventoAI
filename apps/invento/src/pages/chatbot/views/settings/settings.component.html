<div class="space-y-6 pt-6">
  <!-- Success Banner -->
  @if (saveSuccess()) {
    <div
      class="flex items-center gap-3 bg-emerald-50 dark:bg-emerald-950/40 p-4 border border-emerald-200 dark:border-emerald-800/80 rounded-xl text-emerald-800 dark:text-emerald-200 text-xs sm:text-sm transition-all duration-300 ease-in-out"
      [ngClass]="isFadingOut() ? 'opacity-0 -translate-y-2 scale-95' : 'opacity-100 translate-y-0 scale-100 animate-in fade-in slide-in-from-top-2'"
    >
      <div class="flex flex-shrink-0 justify-center items-center bg-emerald-500/20 rounded-full w-6 h-6 text-emerald-600 dark:text-emerald-400">
        <ng-icon name="lucideCheck" size="14" />
      </div>
      <span class="font-medium">Settings updated successfully!</span>
    </div>
  }

  @if (isLoading()) {
    <div class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
    </div>
  } @else {
    <div hlmCard class="bg-card shadow-xs p-0 border border-border/80 rounded-2xl overflow-hidden text-card-foreground">
      <div class="px-4 sm:px-6 py-4 border-border border-b flex items-center justify-between">
        <div>
          <h2 class="font-semibold text-base sm:text-lg leading-tight">Chatbot Configuration</h2>
          <p class="mt-0.5 text-muted-foreground text-xs sm:text-sm">
            Manage your AI advisor's identity and availability.
          </p>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-sm font-medium">Enable Chatbot</label>
          <hlm-switch
            [checked]="isEnabled()"
            (checkedChange)="isEnabled.set($event)"
          />
        </div>
      </div>

      <div class="space-y-5 p-4 sm:p-6">
        <div class="space-y-1.5">
          <label for="greetingInput" class="font-medium text-foreground text-xs sm:text-sm">Custom Greeting Message</label>
          <input
            id="greetingInput"
            hlmInput
            type="text"
            class="w-full"
            placeholder="Leave empty for default AI greeting..."
            [value]="greeting()"
            (input)="greeting.set($any($event.target).value)"
          />
          <p class="mt-1 text-[11px] text-muted-foreground">
            Current effective greeting: <span class="italic">"{{ settings()?.effectiveGreeting }}"</span>
          </p>
        </div>

        <div class="space-y-1.5">
          <label for="toneSelect" class="font-medium text-foreground text-xs sm:text-sm">Conversation Tone</label>
          <div class="relative max-w-sm">
            <select
              id="toneSelect"
              [value]="tone()"
              (change)="tone.set($any($event.target).value)"
              class="flex bg-background shadow-2xs px-3 py-2 border border-input rounded-md focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring w-full h-10 appearance-none text-xs sm:text-sm transition-colors cursor-pointer pe-9"
            >
              @for (t of tones; track t.value) {
                <option [value]="t.value">{{ t.label }}</option>
              }
            </select>
            <ng-icon
              name="lucideChevronDown"
              size="16"
              class="top-1/2 absolute text-muted-foreground -translate-y-1/2 pointer-events-none end-3"
            />
          </div>
        </div>

        <div class="space-y-1.5">
          <label for="emailInput" class="font-medium text-foreground text-xs sm:text-sm">Contact Email / Handover Email</label>
          <input
            id="emailInput"
            hlmInput
            type="email"
            class="w-full max-w-md"
            placeholder="support@yourstore.com"
            [value]="contactEmail()"
            (input)="contactEmail.set($any($event.target).value)"
          />
          <p class="mt-1 text-[11px] text-muted-foreground">
            Provided to users when the chatbot cannot answer a question.
          </p>
        </div>

        <div class="pt-4 border-border border-t flex justify-end">
          <button
            type="button"
            hlmBtn
            class="gap-2 shadow-sm px-6"
            [disabled]="isSaving()"
            (click)="saveSettings()"
          >
            @if (isSaving()) {
              <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
              <span>Saving...</span>
            } @else {
              <ng-icon name="lucideSave" size="16" />
              <span>Save Settings</span>
            }
          </button>
        </div>
      </div>
    </div>
  }
</div>
