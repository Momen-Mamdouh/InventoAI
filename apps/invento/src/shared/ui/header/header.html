<header
  class="flex items-center justify-between h-20 px-8 border-b border-border/40 bg-card/80 backdrop-blur-xl"
>
  <div class="flex items-center gap-2 text-sm text-muted-foreground">
    <nav hlmBreadcrumb>
      <ol hlmBreadcrumbList>
        @for (bc of breadcrumbs(); track bc.route; let last = $last) {
          <li hlmBreadcrumbItem>
            @if (last) {
              <span hlmBreadcrumbPage class="font-semibold text-foreground">{{
                bc.label | translate
              }}</span>
            } @else {
              <a hlmBreadcrumbLink [routerLink]="bc.route">{{ bc.label | translate }}</a>
            }
          </li>
          @if (!last) {
            <li hlmBreadcrumbSeparator>
              <ng-icon name="lucideChevronRight" size="14" class="rtl:rotate-180" />
            </li>
          }
        }
      </ol>
    </nav>
  </div>
  <!-- <app-brand-logo
    logoSrc="light-logo.png"
    logoSrcDark="logo.png"
    [appName]="'app_name' | translate"
    size="md"
  /> -->

  <div class="flex items-center gap-2">
    <!-- <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="relative !rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      [attr.aria-label]="'header_notifications' | translate"
    >
      <ng-icon name="lucideBell" size="18" />
      <span hlmBadge variant="destructive" class="absolute -top-1 -inset-e-1 px-1 text-[10px]"
        >3</span
      >
    </button> -->

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="!rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      (click)="toggleTheme()"
      [attr.aria-label]="'theme_switch' | translate"
    >
      @if (isDark()) {
        <ng-icon name="lucideSun" size="18" />
      } @else {
        <ng-icon name="lucideMoon" size="18" />
      }
    </button>

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="!rounded-full hover:bg-primary/10 hover:text-primary transition-colors duration-200"
      (click)="switchLocale()"
      [attr.aria-label]="'lang_switch' | translate"
    >
      <ng-icon name="lucideGlobe" size="18" />
    </button>
  </div>
</header>
