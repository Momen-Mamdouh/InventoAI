<hlm-sidebar [side]="sidebarSide()" variant="sidebar" collapsible="icon">
  <hlm-sidebar-header>
    <div
      class="flex items-center gap-1 px-2 py-1 group-data-[collapsible=icon]:px-0 group-data-[collapsible=icon]:justify-center"
    >
      <app-brand-logo
        logoSrc="light-logo.png"
        logoSrcDark="logo.png"
        [appName]="'app_name' | translate"
        [showLabel]="false"
        size="md"
        class="shrink-0 group-data-[collapsible=icon]:hidden"
      />
      <button
        hlmSidebarTrigger
        class="ms-auto group-data-[collapsible=icon]:m-0"
        srOnlyText="Toggle Sidebar"
      >
        ''
      </button>
    </div>
  </hlm-sidebar-header>
  <hlm-sidebar-content class="px-3 group-data-[collapsible=icon]:px-2">
    <ul hlmSidebarMenu class="space-y-1">
      @for (item of navItems; track item.route) {
        <li hlmSidebarMenuItem>
          <a
            hlmSidebarMenuButton
            [routerLink]="item.route"
            #rla="routerLinkActive"
            routerLinkActive
            [isActive]="rla.isActive"
            [tooltip]="item.label | translate"
            class="!transition-all !duration-200 !rounded-xl !py-4 group-data-[collapsible=icon]:!p-0 group-data-[collapsible=icon]:justify-center"
            [class.!bg-primary]="rla.isActive"
            [class.!text-primary-foreground]="rla.isActive"
            [class.shadow-md]="rla.isActive"
            [class.shadow-primary/20]="rla.isActive"
            [class.text-sidebar-foreground/70]="!rla.isActive"
            [class.hover:!bg-sidebar-accent]="!rla.isActive"
            [class.hover:!text-sidebar-accent-foreground]="!rla.isActive"
          >
            <ng-icon
              [name]="item.icon"
              size="20"
              [class.text-primary/80]="!rla.isActive"
              [class.text-primary-foreground]="rla.isActive"
            />
            <span class="font-medium text-[15px] group-data-[collapsible=icon]:hidden">{{
              item.label | translate
            }}</span>
          </a>
        </li>
      }
    </ul>
  </hlm-sidebar-content>
  <hlm-sidebar-footer>
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button
          hlmSidebarMenuButton
          [hlmDropdownMenuTrigger]="profileMenu"
          size="lg"
          class="data-[state=open]:bg-sidebar-accent data-[state=open]:text-sidebar-accent-foreground"
        >
          <hlm-avatar class="h-8 w-8 rounded-lg">
            <span hlmAvatarFallback class="rounded-lg bg-primary/20 text-primary font-bold">{{
              userInitials()
            }}</span>
          </hlm-avatar>
          <div
            class="grid flex-1 text-left text-sm leading-tight group-data-[collapsible=icon]:hidden"
          >
            <span class="truncate font-semibold">{{ user().name }}</span>
            <span class="truncate text-xs">{{ user().email }}</span>
          </div>
          <ng-icon
            name="lucideChevronUp"
            size="16"
            class="ml-auto group-data-[collapsible=icon]:hidden"
          />
        </button>
      </li>
    </ul>
  </hlm-sidebar-footer>
</hlm-sidebar>
<button hlmSidebarRail [attr.aria-label]="'toggle_sidebar' | translate"></button>

<ng-template #profileMenu>
  <hlm-dropdown-menu
    class="w-[--radix-dropdown-menu-trigger-width] min-w-56 rounded-lg bg-card border-border"
    side="right"
    align="end"
    sideOffset="4"
  >
    <hlm-dropdown-menu-label class="p-0 font-normal">
      <div class="flex items-center gap-2 px-1 py-1.5 text-left text-sm">
        <hlm-avatar class="h-8 w-8 rounded-lg">
          <span hlmAvatarFallback class="rounded-lg bg-primary/20 text-primary font-bold">{{
            userInitials()
          }}</span>
        </hlm-avatar>
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-semibold text-foreground">{{ user().name }}</span>
          <span class="truncate text-xs text-muted-foreground">{{ user().email }}</span>
        </div>
      </div>
    </hlm-dropdown-menu-label>
    <hlm-dropdown-menu-separator />
    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem routerLink="/stores" class="cursor-pointer gap-2">
        <ng-icon hlm name="lucideStore" />
        <span>My Stores</span>
      </button>
    </hlm-dropdown-menu-group>
    <hlm-dropdown-menu-separator />
    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem routerLink="/profile" class="cursor-pointer gap-2">
        <ng-icon hlm name="lucideUser" />
        <span>Profile</span>
      </button>
      <button hlmDropdownMenuItem routerLink="/security" class="cursor-pointer gap-2">
        <ng-icon hlm name="lucideLock" />
        <span>Security</span>
      </button>
      <button hlmDropdownMenuItem routerLink="/notifications" class="cursor-pointer gap-2">
        <ng-icon hlm name="lucideBell" />
        <span>Notifications</span>
      </button>
      <button hlmDropdownMenuItem routerLink="/billing" class="cursor-pointer gap-2">
        <ng-icon hlm name="lucideCreditCard" />
        <span>Billing & Plan</span>
      </button>
    </hlm-dropdown-menu-group>
    <hlm-dropdown-menu-separator />
    <button hlmDropdownMenuItem class="cursor-pointer gap-2" (click)="logout()">
      <ng-icon hlm name="lucideLogOut" />
      <span>Log out</span>
    </button>
  </hlm-dropdown-menu>
</ng-template>
